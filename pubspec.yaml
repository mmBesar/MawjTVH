name: mawjtvh
description: A Tvheadend client for Android and Linux with a fast guide, recordings and a proper player.
publish_to: "none"
version: 0.1.2+4

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Playback (libmpv on both Android and Linux).
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # State, storage and platform integration.
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  crypto: ^3.0.6
  file_selector: ^1.1.0
  # 2.x depends on package:material_ui, which defines a second ColorScheme
  # type that is incompatible with package:flutter/material.dart.
  dynamic_color: ">=1.9.0 <2.0.0"
  screen_brightness: ^2.1.11
  wakelock_plus: ^1.8.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/mawjtvh_icon.png

  fonts:
    - family: MawjArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
